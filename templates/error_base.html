{% load static %}<!DOCTYPE html>
<html lang="en-GB" data-theme="lifeos-light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<script>(function(){try{document.documentElement.setAttribute("data-theme",matchMedia("(prefers-color-scheme: dark)").matches?"lifeos-dark":"lifeos-light")}catch(e){}})();</script>
<link rel="stylesheet" href="{% static 'css/app.css' %}"><title>{% block title %}Something went wrong{% endblock %}</title></head>
<body class="min-h-screen bg-base-200 font-sans text-base-content antialiased">
<main class="flex min-h-screen items-center justify-center px-4"><div class="card-surface w-full max-w-md p-8 text-center">
  <p class="text-sm font-semibold text-primary">{% block code %}{% endblock %}</p>
  <h1 class="mt-2 text-2xl font-semibold">{% block heading %}{% endblock %}</h1>
  <p class="mt-3 text-sm text-base-content/70">{% block message %}{% endblock %}</p>
  <div class="mt-6 flex justify-center gap-2"><a href="/" class="btn btn-primary btn-sm">Go to the dashboard</a><a href="javascript:history.back()" class="btn btn-ghost btn-sm">Go back</a></div>
</div></main></body></html>
