{% if messages %}
<div class="space-y-2" role="status" aria-live="polite">
  {% for message in messages %}
  <div x-data="{ open: true }" x-show="open" class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %} py-3 text-sm">
    <i data-lucide="{% if message.tags == 'success' %}check-circle-2{% elif message.tags == 'error' %}alert-circle{% else %}info{% endif %}" class="h-5 w-5" aria-hidden="true"></i>
    <span>{{ message }}</span>
    <button type="button" class="btn btn-ghost btn-xs" @click="open = false" aria-label="Dismiss message"><i data-lucide="x" class="h-4 w-4"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}
