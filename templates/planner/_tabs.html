<div class="flex flex-wrap items-center justify-between gap-3">
  <div role="tablist" class="tabs tabs-boxed bg-base-100 border border-base-300">
    <a role="tab" class="tab {% if tab == 'today' %}tab-active{% endif %}" href="{% url 'planner:today' %}">Today</a>
    <a role="tab" class="tab {% if tab == 'week' %}tab-active{% endif %}" href="{% url 'planner:week' %}">Week</a>
    <a role="tab" class="tab {% if tab == 'upcoming' %}tab-active{% endif %}" href="{% url 'planner:upcoming' %}">Upcoming</a>
    <a role="tab" class="tab {% if tab == 'overdue' %}tab-active{% endif %}" href="{% url 'planner:overdue' %}">Overdue</a>
    <a role="tab" class="tab {% if tab == 'all' %}tab-active{% endif %}" href="{% url 'planner:all' %}">All</a>
  </div>
  <a href="{% url 'planner:task_create' %}" class="btn btn-primary btn-sm"><i data-lucide="plus" class="h-4 w-4"></i> New task</a>
</div>
