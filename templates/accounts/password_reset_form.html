{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold">Reset your password</h1>
<p class="mt-1 text-sm text-base-content/60">Enter your email and we'll send a reset link if an account exists.</p>
<form method="post" class="mt-6 space-y-4" novalidate>
  {% csrf_token %}
  {% include "components/field.html" with field=form.email %}
  <button type="submit" class="btn btn-primary w-full">Send reset link</button>
</form>
<div class="mt-4 text-center text-sm"><a class="link link-hover" href="{% url 'accounts:login' %}">Back to sign in</a></div>
{% endblock %}
